<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY TVET Dashboard</title>
  <style>
    /* ── Color Palette ── */
    :root {
      --bg:            #0f1117;
      --surface:       #1c1f2e;
      --surface-alt:   #252838;
      --text:          #e2e8f0;
      --text-muted:    #8892a4;
      --border:        #2d3148;

      --teal:          #2dd4bf;
      --teal-dim:      #1a3d3a;
      --amber:         #fbbf24;
      --amber-dim:     #3b2e0e;
      --violet:        #a78bfa;
      --violet-dim:    #2e2450;

      --done:          #34d399;
      --done-dim:      #0d3327;
      --pending:       #fb923c;
      --pending-dim:   #3b1e0a;
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout Container ── */
    .dashboard-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    .dashboard-header {
      padding: 36px 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .dashboard-header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .dashboard-header h1 span {
      color: var(--teal);
    }

    .dashboard-header .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ══════════════════════════════════════
       SUMMARY CARDS
    ══════════════════════════════════════ */
    .cards-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .card {
      flex: 1 1 240px;
      background: var(--surface);
      border-radius: 12px;
      padding: 24px 20px 20px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    /* Left accent stripe */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      border-radius: 12px 0 0 12px;
    }

    .card--teal::before  { background: var(--teal); }
    .card--amber::before { background: var(--amber); }
    .card--violet::before{ background: var(--violet); }

    /* Top glow pill */
    .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 10px;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .card--teal  .card-icon { background: var(--teal-dim);   color: var(--teal); }
    .card--amber .card-icon { background: var(--amber-dim);  color: var(--amber); }
    .card--violet .card-icon{ background: var(--violet-dim); color: var(--violet); }

    .card-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .card--teal  .card-value { color: var(--teal); }
    .card--amber .card-value { color: var(--amber); }
    .card--violet .card-value{ color: var(--violet); }

    .card-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-secondary {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ══════════════════════════════════════
       CHECKLIST
    ══════════════════════════════════════ */
    .checklist-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }

    .checklist-section h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Each item is a <label> wrapping a hidden checkbox ── */
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--surface-alt);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      border-left: 3px solid var(--pending);
    }

    .checklist-item:hover { background: #2c2f42; }

    /* Hide the native checkbox */
    .checklist-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    /* Checked state — drive all visuals from :has() */
    .checklist-item:has(input:checked) {
      border-left-color: var(--done);
    }

    .status-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--pending-dim);
      color: var(--pending);
      transition: background 0.15s, color 0.15s;
    }

    .checklist-item:has(input:checked) .status-dot {
      background: var(--done-dim);
      color: var(--done);
    }

    /* Checkmark vs open circle rendered via ::before */
    .status-dot::before { content: '○'; }
    .checklist-item:has(input:checked) .status-dot::before { content: '✓'; }

    .item-text {
      flex: 1;
      font-size: 14px;
      transition: opacity 0.15s;
    }

    .checklist-item:has(input:checked) .item-text {
      opacity: 0.55;
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
    }

    .status-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--pending-dim);
      color: var(--pending);
      transition: background 0.15s, color 0.15s;
    }

    .checklist-item:has(input:checked) .status-label {
      background: var(--done-dim);
      color: var(--done);
    }

    /* ══════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════ */
    @media (max-width: 600px) {
      .card { flex: 1 1 100%; }
      .dashboard-header h1 { font-size: 21px; }
    }
  </style>
</head>
<body>

<div class="dashboard-container">

  <!-- ── Header ── -->
  <header class="dashboard-header">
    <h1>MY TVET <span>Dashboard</span></h1>
    <p class="subtitle">Workshop Overview &mdash; 2025</p>
  </header>

  <!-- ── Summary Cards ── -->
  <div class="cards-row">

    <!-- Card 1: Students Registered -->
    <div class="card card--teal">
      <div class="card-icon">🎓</div>
      <div class="card-value">24 / 30</div>
      <div class="card-label">Students Registered</div>
      <div class="card-secondary">6 seats still available</div>
    </div>

    <!-- Card 2: Tasks Remaining -->
    <div class="card card--amber">
      <div class="card-icon">📋</div>
      <div class="card-value" id="tasks-remaining-value">5</div>
      <div class="card-label">Tasks Remaining</div>
      <div class="card-secondary" id="tasks-remaining-sub">2 overdue &middot; 3 on track</div>
    </div>

    <!-- Card 3: Workshop Status -->
    <div class="card card--violet">
      <div class="card-icon">📅</div>
      <div class="card-value">Upcoming</div>
      <div class="card-label">Workshop Status</div>
      <div class="card-secondary">3 days away &middot; June 18, 2025</div>
    </div>

  </div>

  <!-- ── Preparation Checklist ── -->
  <div class="checklist-section">
    <h2>Preparation Checklist</h2>
    <ul class="checklist" id="checklist">

      <label class="checklist-item">
        <input type="checkbox" checked>
        <span class="status-dot"></span>
        <span class="item-text">Send calendar invite to all students</span>
        <span class="status-label">Done</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox" checked>
        <span class="status-dot"></span>
        <span class="item-text">Book the workshop venue / video link</span>
        <span class="status-label">Done</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox" checked>
        <span class="status-dot"></span>
        <span class="item-text">Share pre-reading materials</span>
        <span class="status-label">Done</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox">
        <span class="status-dot"></span>
        <span class="item-text">Prepare attendance sheet</span>
        <span class="status-label">Pending</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox">
        <span class="status-dot"></span>
        <span class="item-text">Verify software environments on workstations</span>
        <span class="status-label">Pending</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox">
        <span class="status-dot"></span>
        <span class="item-text">Brief co-instructors and teaching assistants</span>
        <span class="status-label">Pending</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox">
        <span class="status-dot"></span>
        <span class="item-text">Set up post-workshop feedback form</span>
        <span class="status-label">Pending</span>
      </label>

      <label class="checklist-item">
        <input type="checkbox">
        <span class="status-dot"></span>
        <span class="item-text">Print name tags and handouts</span>
        <span class="status-label">Pending</span>
      </label>

    </ul>
  </div>

</div>

<script>
  (function () {
    var checklist  = document.getElementById('checklist');
    var valueEl    = document.getElementById('tasks-remaining-value');
    var subEl      = document.getElementById('tasks-remaining-sub');

    function updateCard() {
      var boxes   = checklist.querySelectorAll('input[type="checkbox"]');
      var total   = boxes.length;
      var done    = 0;
      boxes.forEach(function (cb) { if (cb.checked) done++; });
      var pending = total - done;

      valueEl.textContent = pending;

      var labels = checklist.querySelectorAll('.status-label');
      boxes.forEach(function (cb, i) {
        labels[i].textContent = cb.checked ? 'Done' : 'Pending';
      });

      if (pending === 0) {
        subEl.textContent = 'All tasks complete \u2713';
      } else {
        subEl.textContent = pending + ' of ' + total + ' tasks left';
      }
    }

    checklist.addEventListener('change', updateCard);
    updateCard();
  })();
</script>

</body>
</html>
